name: E2E

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root123
          POSTGRES_DB: productdb_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Checkout backend (matching branch)
        uses: actions/checkout@v4
        with:
          repository: Neelein/Product_Manger_Backend
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          path: backend

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          E2E_DATABASE_URL: postgres://root:root123@localhost:5432/productdb_e2e?sslmode=disable
          E2E_BACKEND_DIR: ${{ github.workspace }}/backend
        run: npx playwright test

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14